plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gemma.translator'
    compileSdk 34

    defaultConfig {
        applicationId "com.gemma.translator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Gemmaモデル(.litertlm等)をassetsに同梱する場合に圧縮せずそのまま入れるための設定
    aaptOptions {
        noCompress 'litertlm'
        noCompress 'task'
        noCompress 'bin'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // LiteRT-LM: MediaPipe LLM Inference API(tasks-genai)の後継で、Gemma 3以降の
    // .litertlmモデルを動かすための現行ランタイム。tasks-genaiはメンテナンスのみで
    // 新形式の.taskファイルがクラッシュしたため、こちらに移行した。
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.1'
}
